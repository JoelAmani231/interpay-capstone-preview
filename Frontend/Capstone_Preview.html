<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterPay — Mobile Money Transfer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
        
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .animate-slide-in-right { animation: slideInRight 0.3s ease-out forwards; }
        
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        .animate-slide-in-left { animation: slideInLeft 0.3s ease-out forwards; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse-subtle { animation: pulse 2s ease-in-out infinite; }
        
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .animate-scale-in { animation: scaleIn 0.3s ease-out forwards; }
        
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .animate-bounce-subtle { animation: bounce 0.5s ease-in-out; }
        
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .animate-shimmer { 
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        
        @keyframes checkmark { 0% { stroke-dashoffset: 50; } 100% { stroke-dashoffset: 0; } }
        .animate-checkmark { stroke-dasharray: 50; animation: checkmark 0.5s ease-out forwards; }
        
        @keyframes scanMove { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
        .scan-line { position: absolute; width: 100%; height: 2px; background: #10b981; box-shadow: 0 0 4px #10b981; animation: scanMove 2s infinite linear; }
        
        @keyframes toast-in { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toast-out { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-100%); } }
        .toast-enter { animation: toast-in 0.3s ease-out forwards; }
        .toast-exit { animation: toast-out 0.3s ease-in forwards; }
        
        /* Smooth transitions */
        .transition-smooth { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* Hide Scrollbar for clean look */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* ========== PREMIUM DASHBOARD STYLES ========== */
        
        /* Premium Card Hover Effects */
        .premium-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .premium-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
        }
        
        /* Balance Card Glow Effect */
        .balance-card {
            position: relative;
            overflow: hidden;
        }
        .balance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .balance-card:hover::before {
            opacity: 1;
        }
        
        /* Quick Action Button Hover */
        .quick-action-btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .quick-action-btn:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.15);
        }
        .quick-action-btn:active {
            transform: translateY(-2px) scale(0.98);
        }
        
        /* Transaction Row Hover */
        .txn-row {
            transition: all 0.2s ease;
            position: relative;
        }
        .txn-row:hover {
            background: linear-gradient(90deg, rgba(241, 245, 249, 0.8) 0%, rgba(248, 250, 252, 0.4) 100%);
            transform: translateX(4px);
        }
        .txn-row::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .txn-row:hover::after {
            opacity: 1;
        }
        
        /* Icon Container Animations */
        .icon-container {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .group:hover .icon-container {
            transform: scale(1.1) rotate(-5deg);
        }
        
        /* Staggered Animation */
        @keyframes staggerFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stagger-1 { animation: staggerFadeIn 0.5s ease forwards 0.1s; opacity: 0; }
        .stagger-2 { animation: staggerFadeIn 0.5s ease forwards 0.2s; opacity: 0; }
        .stagger-3 { animation: staggerFadeIn 0.5s ease forwards 0.3s; opacity: 0; }
        .stagger-4 { animation: staggerFadeIn 0.5s ease forwards 0.4s; opacity: 0; }
        
        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #1e293b 0%, #475569 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Glowing Border on Focus/Hover */
        .glow-border {
            position: relative;
        }
        .glow-border::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            background: linear-gradient(135deg, #10b981, #3b82f6, #8b5cf6);
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s ease;
            filter: blur(8px);
        }
        .glow-border:hover::before {
            opacity: 0.5;
        }
        
        /* ========== ENHANCED PREMIUM ANIMATIONS ========== */
        
        /* Subtle Balance Pulse */
        @keyframes balancePulse {
            0%, 100% { box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25); }
            50% { box-shadow: 0 25px 60px -8px rgba(15, 23, 42, 0.35); }
        }
        .balance-pulse {
            animation: balancePulse 4s ease-in-out infinite;
        }
        
        /* Float animation for icons */
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }
        .float-icon {
            animation: floatIcon 3s ease-in-out infinite;
        }
        
        /* Shine effect for cards */
        @keyframes shine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }
        .shine-effect {
            position: relative;
            overflow: hidden;
        }
        .shine-effect::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shine 6s ease-in-out infinite;
            pointer-events: none;
        }
        
        /* Hover lift with perspective */
        .hover-lift {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .hover-lift:hover {
            transform: translateY(-6px) scale(1.02);
        }
        .hover-lift:active {
            transform: translateY(-2px) scale(0.98);
        }
        
        /* Soft transition utility */
        .soft-transition {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Enhanced card shadow on hover */
        .card-hover-shadow {
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }
        .card-hover-shadow:hover {
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1), 
                        0 10px 20px -10px rgba(0, 0, 0, 0.04);
        }
        
        /* Action button glow */
        .action-glow {
            position: relative;
        }
        .action-glow::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: inherit;
            filter: blur(12px);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }
        .action-glow:hover::before {
            opacity: 0.4;
        }
        
        /* Smooth border animation */
        @keyframes borderGlow {
            0%, 100% { border-color: rgba(16, 185, 129, 0.3); }
            50% { border-color: rgba(16, 185, 129, 0.6); }
        }
        .border-glow-animate {
            animation: borderGlow 2s ease-in-out infinite;
        }
        
        /* Glass morphism effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        /* Number counter animation */
        @keyframes countUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .count-up {
            animation: countUp 0.5s ease-out forwards;
        }
        
        /* Ripple effect on click */
        .ripple-effect {
            position: relative;
            overflow: hidden;
        }
        .ripple-effect::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease, opacity 0.6s ease;
            opacity: 0;
        }
        .ripple-effect:active::after {
            width: 300px;
            height: 300px;
            opacity: 1;
            transition: 0s;
        }
        
        /* Entrance animations for staggered content */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-up-delay-1 { animation-delay: 0.1s; opacity: 0; }
        .slide-up-delay-2 { animation-delay: 0.2s; opacity: 0; }
        .slide-up-delay-3 { animation-delay: 0.3s; opacity: 0; }
        .slide-up-delay-4 { animation-delay: 0.4s; opacity: 0; }
        .slide-up-delay-5 { animation-delay: 0.5s; opacity: 0; }

        /* ── Dark mode — global override, toggled via body.interpay-dark ──
           Works by re-theming Tailwind's utility classes directly rather than
           adding dark: variants to every component, so it applies app-wide
           without touching existing component JSX. */
        body.interpay-dark {
            background-color: #0b0f19;
        }
        body.interpay-dark .bg-slate-50   { background-color: #0b0f19 !important; }
        body.interpay-dark .bg-white,
        body.interpay-dark .bg-white\/80  { background-color: #161c2c !important; }
        body.interpay-dark .bg-slate-100,
        body.interpay-dark .bg-slate-100\/50 { background-color: #1f2637 !important; }
        body.interpay-dark .bg-slate-900  { background-color: #f1f5f9 !important; color: #0b0f19 !important; }
        body.interpay-dark .text-slate-900 { color: #f1f5f9 !important; }
        body.interpay-dark .text-slate-800 { color: #e2e8f0 !important; }
        body.interpay-dark .text-slate-700 { color: #cbd5e1 !important; }
        body.interpay-dark .text-slate-600 { color: #94a3b8 !important; }
        body.interpay-dark .text-slate-500 { color: #64748b !important; }
        body.interpay-dark .text-slate-400 { color: #475569 !important; }
        body.interpay-dark .border-slate-100,
        body.interpay-dark .border-slate-200 { border-color: #2a3348 !important; }
        body.interpay-dark input,
        body.interpay-dark select {
            background-color: transparent !important;
            color: #f1f5f9 !important;
        }
        body.interpay-dark input::placeholder { color: #475569 !important; }
        body.interpay-dark .shadow-sm,
        body.interpay-dark .shadow-md,
        body.interpay-dark .shadow-xl,
        body.interpay-dark .shadow-2xl { box-shadow: none !important; }
    </style>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-slate-900">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // =====================================================
        // REAL BACKEND API — InterPay
        // =====================================================
        // All calls go to Express backend on localhost:5000
        // Format: { success: boolean, data?: any, error?: string }

        const API_URL = 'http://localhost:5000/api';

        // ── Helper: get token ────────────────────────────────
        const getToken = () => localStorage.getItem('interpay_token');

        // ── Helper: auth headers ─────────────────────────────
        const authHeaders = () => ({
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${getToken()}`,
        });

        // ── Helper: generic fetch wrapper ────────────────────
        const apiFetch = async (method, endpoint, body = null) => {
            const options = { method, headers: authHeaders() };
            if (body) options.body = JSON.stringify(body);
            try {
                const res  = await fetch(`${API_URL}${endpoint}`, options);
                const data = await res.json();
                return data;
            } catch (err) {
                return { success: false, error: 'Cannot reach server. Make sure the backend is running.' };
            }
        };

        // =====================================================
        // OPERATOR SERVICE  (local — no backend needed)
        // =====================================================
        const OperatorService = (() => {
            const OPERATORS = {
                'MOOV_CI':   { code: 'MOOV_CI',   name: 'Moov Money CI',  prefix: '01', color: 'blue',   bgColor: 'bg-blue-100',   textColor: 'text-blue-700',   borderColor: 'border-blue-200',   transferFeePercent: 1, maxTransferAmount: 500000,  minTransferAmount: 100 },
                'MTN_CI':    { code: 'MTN_CI',    name: 'MTN Money CI',   prefix: '05', color: 'yellow', bgColor: 'bg-yellow-100', textColor: 'text-yellow-700', borderColor: 'border-yellow-200', transferFeePercent: 1, maxTransferAmount: 1000000, minTransferAmount: 100 },
                'ORANGE_CI': { code: 'ORANGE_CI', name: 'Orange Money CI',prefix: '07', color: 'orange', bgColor: 'bg-orange-100', textColor: 'text-orange-700', borderColor: 'border-orange-200', transferFeePercent: 1, maxTransferAmount: 750000,  minTransferAmount: 100 },
                'WAVE_CI':   { code: 'WAVE_CI',   name: 'Wave CI',        prefix: '07', color: 'sky',    bgColor: 'bg-sky-100',    textColor: 'text-sky-700',    borderColor: 'border-sky-200',    transferFeePercent: 1, maxTransferAmount: 500000,  minTransferAmount: 100 },
                'WAVE_SN':   { code: 'WAVE_SN',   name: 'Wave SN',        prefix: '77', color: 'sky',    bgColor: 'bg-sky-100',    textColor: 'text-sky-700',    borderColor: 'border-sky-200',    transferFeePercent: 1, maxTransferAmount: 500000,  minTransferAmount: 100 },
                'ORANGE_SN': { code: 'ORANGE_SN', name: 'Orange SN',      prefix: '76', color: 'orange', bgColor: 'bg-orange-100', textColor: 'text-orange-700', borderColor: 'border-orange-200', transferFeePercent: 1, maxTransferAmount: 500000,  minTransferAmount: 100 },
                'ORANGE_BF': { code: 'ORANGE_BF', name: 'Orange BF',      prefix: '55', color: 'orange', bgColor: 'bg-orange-100', textColor: 'text-orange-700', borderColor: 'border-orange-200', transferFeePercent: 1, maxTransferAmount: 500000,  minTransferAmount: 100 },
                'MOOV_BF':   { code: 'MOOV_BF',   name: 'Moov BF',        prefix: '60', color: 'blue',   bgColor: 'bg-blue-100',   textColor: 'text-blue-700',   borderColor: 'border-blue-200',   transferFeePercent: 1, maxTransferAmount: 500000,  minTransferAmount: 100 },
            };

            const PREFIX_MAP = {
                '01': 'MOOV_CI', '05': 'MTN_CI', '07': 'ORANGE_CI',
                '77': 'WAVE_SN', '76': 'ORANGE_SN',
                '55': 'ORANGE_BF', '60': 'MOOV_BF',
            };

            const INTER_OPERATOR_FEES = {
                'MOOV':   { 'MOOV': 0, 'MTN': 1.5, 'ORANGE': 1.5 },
                'MTN':    { 'MOOV': 1.5, 'MTN': 0, 'ORANGE': 1.5 },
                'ORANGE': { 'MOOV': 1.5, 'MTN': 1.5, 'ORANGE': 0 }
            };

            const detectFromPhone = (phone) => {
                const clean  = String(phone).replace(/\D/g, '');
                const prefix = clean.substring(0, 2);
                const code   = PREFIX_MAP[prefix];
                return code ? OPERATORS[code] : null;
            };

            const getByCode = (code) => {
                if (!code) return null;
                const upper = code.toUpperCase();
                // Direct lookup
                if (OPERATORS[upper]) return OPERATORS[upper];
                // Legacy fallback: MOOV→MOOV_CI, MTN→MTN_CI, ORANGE→ORANGE_CI, WAVE→WAVE_CI
                const legacyMap = { 'MOOV': 'MOOV_CI', 'MTN': 'MTN_CI', 'ORANGE': 'ORANGE_CI', 'WAVE': 'WAVE_CI', 'SENEGAL': 'WAVE_SN', 'BURKINA': 'ORANGE_BF' };
                return OPERATORS[legacyMap[upper]] || null;
            };
            const getAll    = () => Object.values(OPERATORS);

            const validatePhone = (phone) => {
                const clean  = String(phone).replace(/\D/g, '');
                const prefix = clean.substring(0, 2);
                const code   = PREFIX_MAP[prefix];
                const intlPrefixes = ['77','76','55','60'];
                const validLen = intlPrefixes.includes(prefix) ? clean.length >= 9 : clean.length === 10;
                if (!validLen) return { valid: false, error: 'Longueur invalide.' };
                if (!code)     return { valid: false, error: 'Préfixe invalide. CI: 01/05/07 — SN: 77/76 — BF: 55/60' };
                return { valid: true, operator: code };
            };

            const validatePin = (pin) => {
                const s = String(pin);
                if (s.length !== 4 || isNaN(pin)) return { valid: false, error: 'PIN must be exactly 4 digits.' };
                return { valid: true };
            };

            const validatePhoneOperator = (phone) => {
                const v = validatePhone(phone);
                if (!v.valid) return { valid: false, error: v.error };
                return { valid: true, operator: OPERATORS[v.operator] };
            };

            const calculateTransferFee = (operatorCode, amount) => {
                const op  = OPERATORS[operatorCode];
                const fee = op ? Math.ceil(amount * (op.transferFeePercent / 100)) : 0;
                return { fee, total: amount + fee, feePercent: op?.transferFeePercent || 0 };
            };

            const calculateInterOperatorFee = (senderOperator, receiverOperator, amount) => {
                const numAmount       = Number(amount) || 0;
                const baseFeePercent  = OPERATORS[senderOperator] ? OPERATORS[senderOperator].transferFeePercent : 1;
                const baseFee         = Math.ceil(numAmount * (baseFeePercent / 100));
                const isInterOperator = senderOperator !== receiverOperator;
                const interOpFeePercent = isInterOperator ? 1.5 : 0; // flat inter-operator fee
                const interOpFee      = Math.ceil(numAmount * (interOpFeePercent / 100));
                const totalFee        = baseFee + interOpFee;
                return {
                    amount: numAmount, baseFee, baseFeePercent,
                    interOpFee, interOpFeePercent, totalFee,
                    total: numAmount + totalFee, isInterOperator,
                    senderOperator, receiverOperator,
                    feeBreakdown: {
                        base: `${baseFeePercent}% base fee`,
                        interOp: isInterOperator ? `${interOpFeePercent}% inter-operator fee` : null
                    }
                };
            };

            const isInterOperatorTransfer   = (s, r) => s !== r;
            const getInterOperatorFeePercent = (s, r) => INTER_OPERATOR_FEES[s]?.[r] || 0;

            const validateTransferAmount = (operatorCode, amount) => {
                const op = OPERATORS[operatorCode];
                if (!op) return { valid: false, error: 'Unknown operator' };
                if (amount < op.minTransferAmount) return { valid: false, error: `Minimum transfer is ${op.minTransferAmount} XOF`, limits: { min: op.minTransferAmount, max: op.maxTransferAmount } };
                if (amount > op.maxTransferAmount) return { valid: false, error: `Maximum transfer is ${op.maxTransferAmount.toLocaleString()} XOF`, limits: { min: op.minTransferAmount, max: op.maxTransferAmount } };
                return { valid: true, limits: { min: op.minTransferAmount, max: op.maxTransferAmount } };
            };

            return {
                detectFromPhone, getByCode, getAll, validatePhone, validatePin,
                validatePhoneOperator, calculateTransferFee, calculateInterOperatorFee,
                isInterOperatorTransfer, getInterOperatorFeePercent, validateTransferAmount,
                OPERATORS, INTER_OPERATOR_FEES
            };
        })();

        // =====================================================
        // AUTH SERVICE
        // =====================================================
        const AuthService = (() => {
            let currentSession = { token: null, user: null, isAuthenticated: false };

            const login = async (phone, pin) => {
                const phoneV = OperatorService.validatePhone(phone);
                if (!phoneV.valid) return { success: false, error: phoneV.error };
                const pinV = OperatorService.validatePin(pin);
                if (!pinV.valid) return { success: false, error: pinV.error };

                try {
                    const res  = await fetch(`${API_URL}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone_number: phone, pin }),
                    });
                    const data = await res.json();

                    if (data.success) {
                        localStorage.setItem('interpay_token', data.data.token);
                        currentSession = { token: data.data.token, user: data.data.user, isAuthenticated: true };
                        return { success: true, data: { user: data.data.user } };
                    }
                    return data;
                } catch {
                    return { success: false, error: 'Cannot reach server. Make sure the backend is running.' };
                }
            };

            const register = async (name, phone, pin) => {
                if (!name || name.trim().length < 2) return { success: false, error: 'Name must be at least 2 characters.' };
                const phoneV = OperatorService.validatePhone(phone);
                if (!phoneV.valid) return { success: false, error: phoneV.error };
                const pinV = OperatorService.validatePin(pin);
                if (!pinV.valid) return { success: false, error: pinV.error };

                try {
                    const res  = await fetch(`${API_URL}/auth/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ full_name: name, phone_number: phone, pin }),
                    });
                    const data = await res.json();
                    return data;
                } catch {
                    return { success: false, error: 'Cannot reach server. Make sure the backend is running.' };
                }
            };

            const logout = async () => {
                await apiFetch('POST', '/auth/logout');
                localStorage.removeItem('interpay_token');
                currentSession = { token: null, user: null, isAuthenticated: false };
                return { success: true, data: { message: 'Logged out successfully' } };
            };

            const getSession       = () => ({ ...currentSession });
            const getToken         = () => localStorage.getItem('interpay_token');
            const isAuthenticated  = () => currentSession.isAuthenticated;
            const getCurrentUser   = () => currentSession.user ? { ...currentSession.user } : null;
            const validatePin      = (pin)   => OperatorService.validatePin(pin);
            const validatePhone    = (phone) => OperatorService.validatePhone(phone);

            const changePin = async (oldPin, newPin) => {
                const oldV = OperatorService.validatePin(oldPin);

        const ContactService = (() => {
            const STORAGE_KEY = 'interpay_contacts';

            const _load = () => {
                try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
                catch { return []; }
            };
            const _save = (contacts) => localStorage.setItem(STORAGE_KEY, JSON.stringify(contacts));

            const getContacts = async () => {
                const contacts  = _load();
                const favorites = contacts.filter(c => c.isFavorite);
                return { success: true, data: { contacts, favorites, count: contacts.length } };
            };

            const getFavorites = async () => {
                const contacts  = _load();
                const favorites = contacts.filter(c => c.isFavorite);
                return { success: true, data: { favorites, count: favorites.length } };
            };

            const addContact = async (name, phone, isFavorite = false) => {
                if (!name || name.trim().length < 2) return { success: false, error: 'Name must be at least 2 characters.' };
                const phoneV = OperatorService.validatePhone(phone);
                if (!phoneV.valid) return { success: false, error: phoneV.error };

                const contacts  = _load();
                const cleanPhone = String(phone).replace(/\D/g, '');
                if (contacts.find(c => c.phone === cleanPhone)) return { success: false, error: 'Contact with this phone already exists.' };

                const newContact = {
                    id: `CON-${Date.now()}`,
                    name: name.trim(), phone: cleanPhone,
                    operator: OperatorService.detectFromPhone(cleanPhone)?.code || 'Unknown',
                    isFavorite: Boolean(isFavorite),
                };
                contacts.push(newContact);
                _save(contacts);
                return { success: true, data: { contact: newContact } };
            };

            const removeContact = async (contactId) => {
                let contacts = _load();
                const idx    = contacts.findIndex(c => c.id === contactId);
                if (idx === -1) return { success: false, error: 'Contact not found.' };
                const deleted = contacts.splice(idx, 1)[0];
                _save(contacts);
                return { success: true, data: { deleted: true, contact: deleted } };
            };

            const searchContacts = async (query) => {
                const contacts = _load();
                const q        = query.toLowerCase().trim();
                const filtered = contacts.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(q));
                return { success: true, data: { contacts: filtered, count: filtered.length, query } };
            };

            const findByPhone = async (phone) => {
                const contacts   = _load();
                const cleanPhone = String(phone).replace(/\D/g, '');
                const contact    = contacts.find(c => c.phone === cleanPhone);
                if (contact) return { success: true, data: { contact } };
                return { success: false, error: 'Contact not found.' };
            };

                if (filters.limit) params.append('limit', filters.limit);
                const query  = params.toString() ? `?${params.toString()}` : '';
                // /api/history returns merged feed: transactions + deposits + gift_cards
                const result = await apiFetch('GET', `/history${query}`);

                if (result.success) {
                    const transactions = result.data.transactions;
                    const stats = calculateStats(transactions);
                    return { success: true, data: { transactions, count: transactions.length, stats } };
                }
                return result;
            };

            const getTransaction = async (transactionId) => {
                const result = await getHistory();
                if (!result.success) return result;
                const transaction = result.data.transactions.find(t => t.id == transactionId);
                if (transaction) return { success: true, data: { transaction } };
                return { success: false, error: 'Transaction not found.' };
            };

            const calculateStats = (transactions) => {
                const stats = { totalSent: 0, totalGiftCards: 0, successCount: 0, failedCount: 0, pendingCount: 0, totalFees: 0 };
                transactions.forEach(txn => {
                    if (txn.type === 'transfer') stats.totalSent += txn.amount;
                    else if (txn.type === 'giftcard') stats.totalGiftCards += txn.amount;
                    if (txn.status === 'Success') stats.successCount++;
                    else if (txn.status === 'Failed') stats.failedCount++;
                    else stats.pendingCount++;
                    if (txn.fee) stats.totalFees += txn.fee;
                });
                return stats;
            };

            const calculateTransferPreview = (receiverPhone, amount, senderOperator = null) => {

                const receiverOpObj  = OperatorService.detectFromPhone(receiverPhone);

                const currentUser    = AuthService.getCurrentUser();
                const fromOp         = senderOperator || currentUser?.operator || null;

                if (!receiverOp || !fromOp) {
                    const fee = Math.ceil(numAmount * 0.01);
                    return { amount: numAmount, baseFee: fee, interOpFee: 0, totalFee: fee, total: numAmount + fee, senderOperator: fromOp, receiverOperator: receiverOp, isInterOperator: false, feePercent: 1, feeBreakdown: { base: '1% base fee', interOp: null } };
                }

                const feeCalc = OperatorService.calculateInterOperatorFee(fromOp, receiverOp, numAmount);
                return { amount: numAmount, baseFee: feeCalc.baseFee, interOpFee: feeCalc.interOpFee, totalFee: feeCalc.totalFee, total: feeCalc.total, senderOperator: fromOp, receiverOperator: receiverOp, isInterOperator: feeCalc.isInterOperator, feePercent: feeCalc.baseFeePercent + feeCalc.interOpFeePercent, feeBreakdown: feeCalc.feeBreakdown };

                    amount:       numAmount,

                    return { success: true, data: { transaction: result.data.transaction, newBalance: result.data.newBalance } };

        /**
         * Validates receiver phone number based on selected operator
         * @param {string} number - The receiver phone number (10 digits)
         * @param {string} operatorId - The operator ID (wave, orange, mtn, moov)
         * @returns {object} - { valid: true } or { valid: false, error: "reason" }
         */
        const validateReceiverNumber = (number, operatorId) => {
            // Check if number is provided
            if (!number || number.trim() === '') {
                return { valid: false, error: 'Receiver number is required' };
            }

            // Clean the number - remove non-digits
            const cleanNumber = number.replace(/\D/g, '');

            // Check if number contains only digits
            if (!/^\d+$/.test(cleanNumber)) {
                return { valid: false, error: 'Receiver number must contain only digits' };
            }

            // Check if number is exactly 10 digits
            if (cleanNumber.length !== 10) {
                return { valid: false, error: `Receiver number must be exactly 10 digits (currently ${cleanNumber.length})` };
            }

            // Get the prefix (first 2 digits)
            const prefix = cleanNumber.substring(0, 2);

            // Define allowed prefixes per operator
            const operatorPrefixRules = {
                'orange': {
                    allowedPrefixes: ['07'],
                    errorMessage: 'Orange Money numbers must start with 07'
                },
                'mtn': {
                    allowedPrefixes: ['05'],
                    errorMessage: 'MTN Money numbers must start with 05'
                },
                'moov': {
                    allowedPrefixes: ['01'],
                    errorMessage: 'Moov Money numbers must start with 01'
                },
                'wave': {
                    allowedPrefixes: ['01', '05', '07'],
                    errorMessage: 'Wave numbers must start with 01, 05, or 07'
                },
            };

            // If operatorId is specified, validate against operator-specific rules
            if (operatorId && operatorPrefixRules[operatorId]) {
                const rules = operatorPrefixRules[operatorId];
                if (!rules.allowedPrefixes.includes(prefix)) {
                    return { valid: false, error: rules.errorMessage };
                }
            } else {
                // General validation: all known prefixes
                if (!['01','05','07','77','76','55','60'].includes(prefix)) {
                    return { valid: false, error: 'Préfixe invalide. CI: 01/05/07 — SN: 77/76 — BF: 55/60' };
                }
            }

            return { valid: true, error: null };
        };

        const BusinessRules = {
            PHONE_LENGTH: 10,
            PIN_LENGTH: 4,

            // Validate phone number (exactly 10 digits for CI, 9-10 for intl)
            validatePhone: (phone) => {
                const cleanPhone = phone.replace(/\D/g, '');
                const prefix = cleanPhone.substring(0, 2);
                const intl = ['77','76','55','60'].includes(prefix);
                return intl ? cleanPhone.length >= 9 : cleanPhone.length === 10;
            },
            
            // Validate PIN (numeric and exactly 4 digits)
            validatePin: (pin) => {
                return /^\d{4}$/.test(pin);
            },
            
            // Detect operator from phone prefix — uses OperatorService PREFIX_MAP
            detectOperator: (phone) => {
                const cleanPhone = phone.replace(/\D/g, '');
                if (cleanPhone.length < 2) return null;
                const prefix = cleanPhone.substring(0, 2);
                // PREFIX_MAP: 01→MOOV_CI, 05→MTN_CI, 07→ORANGE_CI, 77→WAVE_SN, 76→ORANGE_SN, 55→ORANGE_BF, 60→MOOV_BF
                const PREFIX_TO_CODE = {
                    '01': 'MOOV_CI', '05': 'MTN_CI', '07': 'ORANGE_CI',
                    '77': 'WAVE_SN', '76': 'ORANGE_SN',
                    '55': 'ORANGE_BF', '60': 'MOOV_BF',
                };
                return PREFIX_TO_CODE[prefix] || null;
            },
            
            // Validate phone prefix — CI + SN + BF
            isValidPrefix: (phone) => {
                const cleanPhone = phone.replace(/\D/g, '');
                if (cleanPhone.length < 2) return true;
                const prefix = cleanPhone.substring(0, 2);
                return ['01','05','07','77','76','55','60'].includes(prefix);
            },
            
            // Get validation error messages
            getPhoneError: (phone) => {
                const cleanPhone = phone.replace(/\D/g, '');
                if (cleanPhone.length === 0) return null;
                if (cleanPhone.length >= 2 && !BusinessRules.isValidPrefix(phone)) {
                    return 'Préfixe invalide. CI: 01/05/07 — Sénégal: 77/76 — Burkina: 55/60';
                }
                if (cleanPhone.length > 0 && cleanPhone.length !== 10) {
                    return `Phone must be exactly 10 digits (currently ${cleanPhone.length})`;
                }
                return null;
            },
            
            getPinError: (pin) => {
                if (pin.length === 0) return null;

                setToasts(prev => [...prev, { id, message, type, exiting: false }]);
                
                setTimeout(() => {
                    setToasts(prev => prev.map(t => t.id === id ? { ...t, exiting: true } : t));
                    setTimeout(() => {
                        setToasts(prev => prev.filter(t => t.id !== id));
                    }, 300);
                }, duration);
            };

            const toast = {
                success: (msg) => addToast(msg, 'success'),
                error: (msg) => addToast(msg, 'error'),
                info: (msg) => addToast(msg, 'info'),
                warning: (msg) => addToast(msg, 'warning'),
            };

            return (

                    {children}

                    '55': 'ORANGE_BF', '60': 'MOOV_BF',
                };
                return PREFIX[p.substring(0, 2)] || null;
            };

            const handlePhoneChange = (val) => {
                setPhone(val);
                setDetectedOp(null);
                setPhoneReady(false);
                setApiError('');
                setPin('');

                // Auto-detect when enough digits typed
                const minLen = ['77','76','55','60'].includes(val.substring(0,2)) ? 9 : 10;
                if (val.length >= minLen) {
                    const op = detectFromPhone(val);
                    if (op) {
                        setDetecting(true);
                        // Simulate backend detection (brief spinner)
                        setTimeout(() => {
                            setDetectedOp(op);
                            setDetecting(false);
                            setPhoneReady(true);
                        }, 800);
                    }
                }
            };

            const handleSubmit = async () => {
                setApiError('');
                setIsLoading(true);
                try {
                    const result = isRegister
                        ? await AuthService.register(name.trim(), phone, pin)
                        : await AuthService.login(phone, pin);
                    if (result.success) {
                        setUser({
                            id: result.data.user.id, name: result.data.user.name,
                            phone: result.data.user.phone, operator: result.data.user.operator,
                            balance: result.data.user.balance, avatar: null,
                            login_count: result.data.user.login_count || 0,
                            last_login: result.data.user.last_login || null,
                        });
                        onLogin();
                    } else {
                        setApiError(result.error || 'Erreur. Réessayez.');
                    }
                } catch {
                    setApiError('Impossible de joindre le serveur.');
                } finally {
                    setIsLoading(false);
                }
            };

            const isValid = isRegister
                ? name.trim().length >= 2 && phoneReady && BusinessRules.validatePin(pin)
                : phoneReady && BusinessRules.validatePin(pin);

            const opCfg = detectedOp ? OP_CONFIG[detectedOp] : null;

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-50 p-4">
                    <div className="w-full max-w-sm">
                        {/* Logo */}
                        <div className="text-center mb-8">
                            <div className="inline-flex items-center justify-center w-16 h-16 rounded-3xl bg-slate-900 text-white mb-4 shadow-xl">
                                <Icons.Globe size={30} />
                            </div>
                            <h1 className="text-3xl font-bold text-slate-900">InterPay</h1>
                            <p className="text-slate-400 text-sm mt-1">
                                {isRegister ? 'Créer un compte' : 'Bienvenue'}
                            </p>
                        </div>

                        <div className="bg-white rounded-3xl shadow-xl p-6 space-y-4">
                            {apiError && (
                                <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm flex items-center gap-2">
                                    <Icons.AlertCircle size={15} />
                                    {apiError}
                                </div>
                            )}

                            {isRegister && (
                                <div>
                                    <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide block mb-1.5">Nom complet</label>
                                    <input type="text" value={name} onChange={e => setName(e.target.value)}
                                        placeholder="Jean Dupont"
                                        className="w-full px-4 py-3 border-2 border-slate-200 rounded-2xl outline-none focus:border-slate-900 text-slate-900 font-medium transition-colors" />
                                </div>
                            )}

                            {/* Phone input */}
                            <div>
                                <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide block mb-1.5">Numéro de téléphone</label>
                                <div className={`flex items-center border-2 rounded-2xl overflow-hidden transition-colors ${detecting ? 'border-purple-400' : phoneReady ? 'border-emerald-500' : 'border-slate-200'}`}>
                                    <input type="tel" value={phone}
                                        onChange={e => handlePhoneChange(e.target.value.replace(/\D/g,'').substring(0,10))}
                                        placeholder="0712345678"
                                        className="flex-1 px-4 py-3.5 outline-none text-slate-900 font-semibold text-lg bg-white"
                                        autoFocus={!isRegister} />
                                    <div className="pr-3 flex items-center gap-2">
                                        {detecting && (
                                            <div className="w-5 h-5 border-2 border-purple-400 border-t-transparent rounded-full animate-spin" />
                                        )}
                                        {!detecting && phoneReady && opCfg && (
                                            <div className="flex items-center gap-1.5 bg-emerald-50 border border-emerald-200 rounded-xl px-2 py-1">
                                                <div className="w-2 h-2 bg-emerald-500 rounded-full" />
                                                <span className="text-xs font-bold text-emerald-700">{opCfg.name}</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                                {detecting && (
                                    <p className="text-xs text-purple-500 mt-1.5 ml-1 flex items-center gap-1">
                                        <span>Détection de l'opérateur...</span>
                                    </p>
                                )}
                                {!detecting && phoneReady && opCfg && (
                                    <p className="text-xs text-emerald-600 mt-1.5 ml-1 font-medium">
                                        ✓ Opérateur détecté : {opCfg.name}
                                    </p>
                                )}
                            </div>

                            {/* PIN — only shown after operator detected */}
                            {phoneReady && (
                                <div className="animate-fade-in">
                                    <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide block mb-1.5">Code secret</label>
                                    <PinInput value={pin} onChange={setPin} label="" placeholder="••••" />
                                </div>
                            )}

                            {/* Submit */}
                            {phoneReady && (
                                <div className="pt-1 animate-fade-in">
                                    <button onClick={handleSubmit}
                                        disabled={!isValid || isLoading}
                                        className={`w-full py-4 rounded-2xl font-bold text-base transition-all ${isValid && !isLoading ? 'bg-slate-900 text-white hover:bg-slate-800 shadow-lg' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                                        {isLoading ? (
                                            <span className="flex items-center justify-center gap-2">
                                                <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                                                {isRegister ? 'Création...' : 'Connexion...'}
                                            </span>
                                        ) : isRegister ? 'Créer le compte' : 'Se connecter'}
                                    </button>
                                </div>
                            )}
                        </div>

                        <button onClick={() => { setIsRegister(r => !r); setPhone(''); setPin(''); setName(''); setDetectedOp(null); setPhoneReady(false); setApiError(''); }}
                            className="w-full text-center mt-5 text-sm text-slate-500 hover:text-slate-900 font-medium transition-colors">
                            {isRegister ? 'Déjà un compte ? Se connecter' : 'Nouveau ? Créer un compte'}
                        </button>
                    </div>
                </div>
            );
        };



        const GiftCardView = ({ setView, setLastTxn, updateUserBalance, user }) => {
            const LOGO = '../Logos/';
            const userCountry = user.operator?.endsWith('_SN') ? 'SN' : user.operator?.endsWith('_BF') ? 'BF' : 'CI';

            const cards = [
                { id: 'amazon',  name: 'Amazon',        icon: '📦', color: 'from-amber-400 to-orange-500',  text: 'text-slate-900' },
                { id: 'apple',   name: 'Apple / iTunes',icon: '🍎', color: 'from-gray-700 to-gray-900',     text: 'text-white' },
                { id: 'google',  name: 'Google Play',   icon: '▶️', color: 'from-green-400 to-teal-500',    text: 'text-white' },
                { id: 'netflix', name: 'Netflix',       icon: '🎬', color: 'from-red-500 to-red-700',       text: 'text-white' },
                { id: 'steam',   name: 'Steam',         icon: '🎮', color: 'from-blue-800 to-indigo-900',   text: 'text-white' },
            ];

            const PAY_OPS = {
                CI: [
                    { id: 'wave_ci',   code: 'WAVE_CI',   name: 'Wave CI',   logo: LOGO+'Wave-logo.jpg' },
                    { id: 'orange_ci', code: 'ORANGE_CI', name: 'Orange CI', logo: LOGO+'Orange.png' },
                    { id: 'mtn_ci',    code: 'MTN_CI',    name: 'MTN CI',    logo: LOGO+'Mtn.png' },
                    { id: 'moov_ci',   code: 'MOOV_CI',   name: 'Moov CI',   logo: LOGO+'Moov_Money.png' },
                ],
                SN: [
                    { id: 'wave_sn',   code: 'WAVE_SN',   name: 'Wave SN',   logo: LOGO+'Wave-logo.jpg' },
                    { id: 'orange_sn', code: 'ORANGE_SN', name: 'Orange SN', logo: LOGO+'Orange.png' },
                ],
                BF: [
                    { id: 'orange_bf', code: 'ORANGE_BF', name: 'Orange BF', logo: LOGO+'Orange.png' },
                    { id: 'moov_bf',   code: 'MOOV_BF',   name: 'Moov BF',   logo: LOGO+'Moov_Money.png' },
                ],
            };
            const payOps = PAY_OPS[userCountry] || PAY_OPS.CI;

            const AMOUNTS = [5000, 10000, 25000, 50000];

            const [selectedCard,  setSelectedCard]  = useState(null);
            const [amount,        setAmount]        = useState('');
            const [customAmount,  setCustomAmount]  = useState('');
            const [payOp,         setPayOp]         = useState(() => payOps.find(o => o.code === user.operator) || payOps[0]);
            const [useOther,      setUseOther]      = useState(false);
            const [otherPhone,    setOtherPhone]    = useState('');
            const [pin,           setPin]           = useState('');
            const [isLoading,     setIsLoading]     = useState(false);
            const [error,         setError]         = useState('');
            const [generatedCode, setGeneratedCode] = useState(null);
            const [codeCopied,    setCodeCopied]    = useState(false);
            const toast = useToast();

            // ── "My Cards" tab — list previously purchased cards (uses existing GET /api/giftcards) ──
            const [tab,          setTab]          = useState('buy');
            const [myCards,      setMyCards]      = useState([]);
            const [loadingCards, setLoadingCards] = useState(false);
            const [copiedId,     setCopiedId]     = useState(null);

            useEffect(() => {
                if (tab !== 'mine') return;
                (async () => {
                    setLoadingCards(true);
                    const result = await TransactionService.getGiftCards();
                    if (result.success) setMyCards(result.data.giftCards);
                    setLoadingCards(false);
                })();
            }, [tab]);

            const actualAmount  = amount === 'custom' ? Number(customAmount) : Number(amount);
            const isOwnPayOp    = payOp.code === user.operator;
            const effPhone      = isOwnPayOp && !useOther ? user.phone : otherPhone;
            const isPinValid    = BusinessRules.validatePin(pin);
            const isValid       = selectedCard && actualAmount >= 100 && effPhone.length >= 8 && isPinValid;

            const selectPayOp = (op) => {
                setPayOp(op);
                if (op.code === user.operator) { setUseOther(false); setOtherPhone(''); }
                else { setUseOther(true); setOtherPhone(''); }
            };

            const handlePurchase = async () => {
                if (!isValid || isLoading) return;
                setIsLoading(true);
                setError('');
                try {
                    const result = await TransactionService.purchaseGiftCardWithCode({
                        cardType: selectedCard.id, cardName: selectedCard.name,
                        amount: actualAmount, pin, paymentPhone: effPhone,
                    });
                    if (result.success) {
                        updateUserBalance(result.data.newBalance);
                        setLastTxn(result.data.transaction);
                        setGeneratedCode(result.data.code);
                    } else {
                        setError(result.error);
                        toast.error(result.error);
                    }
                } catch {
                    setError('Erreur inattendue.');
                } finally {
                    setIsLoading(false);
                }
            };

            // ── SUCCESS SCREEN ────────────────────────────────────
            if (generatedCode) return (
                <div className="max-w-xl mx-auto animate-fade-in pt-8 text-center space-y-6">
                    <SuccessAnimation size={70} />
                    <div>
                        <p className="text-slate-500 text-sm">Votre gift card</p>
                        <h2 className="text-2xl font-bold text-slate-900">{selectedCard?.name}</h2>
                        <p className="text-slate-500 mt-1">{actualAmount.toLocaleString()} XOF</p>
                    </div>
                    <div className="bg-slate-50 border-2 border-dashed border-slate-300 rounded-3xl p-6">
                        <p className="text-xs text-slate-400 uppercase tracking-wider mb-3">Code Gift Card</p>
                        <p className="font-mono font-bold text-2xl text-slate-900 tracking-widest select-all">{generatedCode}</p>
                        <button onClick={() => { navigator.clipboard.writeText(generatedCode); setCodeCopied(true); setTimeout(() => setCodeCopied(false), 2000); }}
                            className={`mt-4 flex items-center gap-2 mx-auto px-4 py-2 rounded-xl text-sm font-semibold transition-all ${codeCopied ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'}`}>
                            {codeCopied ? <><Icons.CheckCircle size={14}/> Copié !</> : <><Icons.Copy size={14}/> Copier le code</>}
                        </button>
                    </div>
                    <button onClick={() => { setGeneratedCode(null); setTab('mine'); }} className="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-slate-800 transition-colors">
                        Voir mes cartes
                    </button>
                    <button onClick={() => setView('dashboard')} className="w-full py-3 text-slate-500 font-semibold hover:text-slate-700 transition-colors">
                        Retour au tableau de bord
                    </button>
                </div>
            );

            // ── MY CARDS TAB ────────────────────────────────────────
            if (tab === 'mine') return (
                <div className="max-w-xl mx-auto pb-8 animate-fade-in">
                    <div className="flex items-center gap-3 mb-6">
                        <button onClick={() => setView('dashboard')} className="p-2 hover:bg-slate-100 rounded-full transition-colors">
                            <Icons.ChevronLeft size={22} />
                        </button>
                        <h1 className="text-2xl font-bold text-slate-900">Gift Cards</h1>
                    </div>

                    <div className="flex gap-2 mb-5 bg-slate-100 p-1 rounded-2xl">
                        <button onClick={() => setTab('buy')} className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-slate-500 hover:text-slate-700 transition-all">Acheter</button>
                        <button onClick={() => setTab('mine')} className="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-white text-slate-900 shadow-sm transition-all">Mes cartes</button>
                    </div>

                    {loadingCards && (
                        <div className="text-center py-10">
                            <div className="w-8 h-8 border-2 border-slate-200 border-t-slate-900 rounded-full animate-spin mx-auto mb-2"></div>
                            <p className="text-sm text-slate-500">Chargement...</p>
                        </div>
                    )}

                    {!loadingCards && myCards.length === 0 && (
                        <div className="text-center py-14 text-slate-400">
                            <Icons.Gift size={32} className="mx-auto mb-2 opacity-50" />
                            <p className="text-sm">Aucune gift card achetée pour l'instant.</p>
                        </div>
                    )}

                    <div className="space-y-3">
                        {myCards.map(card => {
                            const cardMeta = cards.find(c => c.id === card.cardType);
                            return (
                                <div key={card.id} className={`rounded-3xl p-5 bg-gradient-to-br ${cardMeta?.color || 'from-slate-700 to-slate-900'} ${cardMeta?.text || 'text-white'} shadow-sm`}>
                                    <div className="flex items-start justify-between">
                                        <div className="flex items-center gap-2">
                                            <span className="text-2xl">{cardMeta?.icon || '🎁'}</span>
                                            <div>
                                                <p className="font-bold">{card.companyName || cardMeta?.name || card.cardType}</p>
                                                <p className="text-xs opacity-70">{card.amount.toLocaleString()} XOF · {new Date(card.purchasedAt).toLocaleDateString()}</p>
                                            </div>
                                        </div>
                                        <span className={`text-xs font-bold px-2 py-1 rounded-full ${card.status === 'active' ? 'bg-white/20' : 'bg-black/20'}`}>
                                            {card.status === 'active' ? 'Active' : card.status === 'used' ? 'Utilisée' : 'Expirée'}
                                        </span>
                                    </div>
                                    <div className="mt-4 bg-black/20 rounded-2xl p-3 flex items-center justify-between">
                                        <p className="font-mono font-bold tracking-widest text-sm select-all">{card.cardCode}</p>
                                        <button onClick={() => { navigator.clipboard.writeText(card.cardCode); setCopiedId(card.id); setTimeout(() => setCopiedId(null), 2000); }}
                                            className="flex-shrink-0 ml-3 p-1.5 rounded-lg hover:bg-white/10 transition-colors">
                                            {copiedId === card.id ? <Icons.CheckCircle size={16} /> : <Icons.Copy size={16} />}
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );

            return (
                <div className="max-w-xl mx-auto pb-8 animate-fade-in">
                    <div className="flex items-center gap-3 mb-6">
                        <button onClick={() => setView('dashboard')} className="p-2 hover:bg-slate-100 rounded-full transition-colors">
                            <Icons.ChevronLeft size={22} />
                        </button>
                        <h1 className="text-2xl font-bold text-slate-900">Gift Cards</h1>
                    </div>

                    <div className="flex gap-2 mb-5 bg-slate-100 p-1 rounded-2xl">
                        <button onClick={() => setTab('buy')} className="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-white text-slate-900 shadow-sm transition-all">Acheter</button>
                        <button onClick={() => setTab('mine')} className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-slate-500 hover:text-slate-700 transition-all">Mes cartes</button>
                    </div>

                    <div className="space-y-5">
                        {/* ── CARTE ── */}
                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Choisir une carte</p>
                            <div className="grid grid-cols-5 gap-2">
                                {cards.map(c => (
                                    <button key={c.id} onClick={() => setSelectedCard(c)}
                                        className={`relative flex flex-col items-center gap-1.5 p-2.5 rounded-2xl border-2 transition-all ${selectedCard?.id === c.id ? 'border-slate-900 shadow-md scale-105' : 'border-slate-200 hover:border-slate-300'}`}>
                                        {selectedCard?.id === c.id && (
                                            <div className="absolute -top-1.5 -right-1.5 w-5 h-5 bg-emerald-500 rounded-full flex items-center justify-center">
                                                <Icons.CheckCircle size={12} className="text-white" />
                                            </div>
                                        )}
                                        <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${c.color} flex items-center justify-center text-xl`}>
                                            {c.icon}
                                        </div>
                                        <span className="text-xs font-semibold text-slate-700 text-center leading-tight">{c.name.split(' ')[0]}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* ── MONTANT ── */}
                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-3">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Montant</p>
                            <div className="grid grid-cols-4 gap-2">
                                {AMOUNTS.map(a => (
                                    <button key={a} onClick={() => { setAmount(String(a)); setCustomAmount(''); }}
                                        className={`py-3 rounded-2xl text-sm font-bold border-2 transition-all ${amount === String(a) ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 text-slate-600 hover:border-slate-400'}`}>
                                        {(a/1000)}k
                                    </button>
                                ))}
                            </div>
                            <div className="flex items-stretch border-2 border-slate-200 rounded-2xl overflow-hidden focus-within:border-slate-900 transition-colors">
                                <input type="tel" value={amount === 'custom' ? customAmount : ''}
                                    placeholder="Montant personnalisé"
                                    onFocus={() => setAmount('custom')}
                                    onChange={e => { setAmount('custom'); if (/^\d*$/.test(e.target.value)) setCustomAmount(e.target.value); }}
                                    className="flex-1 px-4 py-3 outline-none text-slate-900 font-semibold text-sm min-w-0" />
                                <div className="bg-slate-100 px-3 flex items-center border-l-2 border-slate-200">
                                    <span className="text-slate-700 font-bold text-sm">XOF</span>
                                </div>
                            </div>
                        </div>

                        {/* ── PAIEMENT ── */}
                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-3">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Payer avec</p>
                            <div className="flex flex-wrap gap-2">
                                {payOps.map(op => (
                                    <button key={op.id} onClick={() => selectPayOp(op)}
                                        className={`flex items-center gap-2 px-3 py-2 rounded-2xl border-2 text-sm font-semibold transition-all ${payOp.id === op.id ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 text-slate-600 hover:border-slate-400'}`}>
                                        <OperatorLogo operatorId={op.id.split('_')[0]} size={18} logo={op.logo} />
                                        {op.name}
                                    </button>
                                ))}
                            </div>

                            {/* Number for that operator — switching above always clears this,
                                same fix as Send/International. */}
                            {isOwnPayOp ? (
                                <>
                                    <div className="flex gap-2">
                                        <button onClick={() => setUseOther(false)}
                                            className={`flex items-center gap-2 px-3 py-2.5 rounded-xl border-2 text-sm font-semibold flex-1 transition-all ${!useOther ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 text-slate-600'}`}>
                                            <Icons.User size={13} /> {user.phone}
                                        </button>
                                        <button onClick={() => setUseOther(u => !u)}
                                            className={`px-3 py-2.5 rounded-xl border-2 text-sm font-semibold transition-all ${useOther ? 'border-purple-600 bg-purple-600 text-white' : 'border-slate-200 text-slate-600'}`}>
                                            <Icons.Plus size={14} />
                                        </button>
                                    </div>
                                    {useOther && (
                                        <input type="tel" placeholder="Autre numéro..." value={otherPhone}
                                            onChange={e => setOtherPhone(e.target.value.replace(/\D/g,'').substring(0,10))}
                                            className="w-full px-3 py-2.5 border-2 border-slate-200 rounded-xl text-sm outline-none focus:border-purple-400 animate-fade-in" />
                                    )}
                                </>
                            ) : (
                                <input type="tel" placeholder={`Votre numéro ${payOp.name}`} value={otherPhone} autoFocus
                                    onChange={e => setOtherPhone(e.target.value.replace(/\D/g,'').substring(0,10))}
                                    className="w-full px-3 py-2.5 border-2 border-purple-300 rounded-xl text-sm outline-none focus:border-purple-500 animate-fade-in" />
                            )}

                            {effPhone.length >= 8 && (
                                <p className="text-xs text-slate-500 px-1">
                                    <span className="font-semibold text-emerald-600">{effPhone} — sera débité</span>
                                </p>
                            )}
                        </div>

                        {/* ── Résumé rapide ── */}
                        {selectedCard && actualAmount > 0 && (
                            <div className="bg-slate-900 rounded-3xl p-4 text-white animate-fade-in">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <span className="text-2xl">{selectedCard.icon}</span>
                                        <div>
                                            <p className="font-bold">{selectedCard.name}</p>
                                            <p className="text-slate-400 text-xs">{effPhone} · {payOp?.name}</p>
                                        </div>
                                    </div>
                                    <p className="text-xl font-bold text-emerald-400">{actualAmount.toLocaleString()} <span className="text-sm text-slate-400">XOF</span></p>
                                </div>
                            </div>
                        )}

                        {/* ── CODE SECRET ── */}
                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Code secret</p>
                            <PinInput value={pin} onChange={setPin} label="" placeholder="••••" />
                        </div>
