                ...staticContacts.filter(c => !frequentContacts.some(f => f.phone === c.phone)),
            ];

            // ── Depuis: pick the operator first (chips), like before — but switching
            //    operator now forces you to give the real number for THAT network
            //    instead of silently leaving your own phone number in place. ──
            const [sourceOp,      setSourceOp]      = useState(() => operators.find(o => o.code === user.operator) || operators[0]);
            const [useOtherSrc,   setUseOtherSrc]   = useState(false);
            const [otherSrc,      setOtherSrc]      = useState('');
            const [receiverPhone, setReceiverPhone] = useState('');
            const [receiverName,  setReceiverName]  = useState('');
            const [amount,        setAmount]        = useState('');
            const [pin,           setPin]           = useState('');
            const [isLoading,     setIsLoading]     = useState(false);
            const [error,         setError]         = useState('');
            const [showConfirm,   setShowConfirm]   = useState(false);
            const [search,        setSearch]        = useState('');
            const toast = useToast();

            const isOwnOperator = sourceOp.code === user.operator;
            const effSrc        = isOwnOperator && !useOtherSrc ? user.phone : otherSrc;

            const selectSourceOp = (op) => {
                setSourceOp(op);
                if (op.code === user.operator) { setUseOtherSrc(false); setOtherSrc(''); }
                else { setUseOtherSrc(true); setOtherSrc(''); }
            };

            // Vers stays auto-detected from the typed number — that part wasn't the complaint.
            const destOp = useMemo(() => OperatorService.detectFromPhone(receiverPhone), [receiverPhone]);

            const numAmount   = Number(amount) || 0;
            const baseFee     = numAmount > 0 ? Math.ceil(numAmount * 0.01) : 0;
            const interFee    = sourceOp && destOp && sourceOp.code !== destOp.code ? Math.ceil(numAmount * 0.005) : 0;
            const totalFee    = baseFee + interFee;
            // What the backend actually debits — always amount + fee, no matter what. There is no
            // "receiver absorbs the fee" mode server-side, so the UI must never claim there is one.
            const totalDebit  = numAmount + totalFee;
            const isValid     = destOp && effSrc.length >= 8 && receiverPhone.length >= 9 && numAmount >= 250 && numAmount % 10 === 0 && BusinessRules.validatePin(pin);

            const filteredContacts = contacts.filter(c =>
                c.name.toLowerCase().includes(search.toLowerCase()) || c.phone.includes(search)
            );

            const handleSend = async () => {
                if (!isValid || isLoading) return;
                setIsLoading(true);
                setError('');
                try {
                    const result = await TransactionService.sendMoney({
                        receiverPhone, receiverName: receiverName || receiverPhone,
                        amount: numAmount, pin, sourcePhone: effSrc,
                    });
                    if (result.success) {
                        updateUserBalance(result.data.newBalance);
                        setLastTxn({ ...result.data.transaction, operatorName: destOp?.name });
                        setView('status');
                    } else {
                        setError(result.error);
                        toast.error(result.error);
                    }
                } catch {
                    setError('Erreur inattendue.');
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="max-w-xl mx-auto pb-8 animate-fade-in">
                    {/* Header */}
                    <div className="flex items-center gap-3 mb-6">
                        <button onClick={() => setView('dashboard')} className="p-2 hover:bg-slate-100 rounded-full transition-colors">
                            <Icons.ChevronLeft size={22} />
                        </button>
                        <h1 className="text-2xl font-bold text-slate-900">Envoyer de l'argent</h1>
                    </div>

                    <div className="space-y-5">
                        {/* ── DEPUIS ── */}
                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-4">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Depuis</p>

                            {/* Pick the operator first */}
                            <div className="flex flex-wrap gap-2">
                                {operators.map(op => (
                                    <button key={op.id} onClick={() => selectSourceOp(op)}
                                        className={`flex items-center gap-2 px-3 py-2 rounded-2xl border-2 transition-all text-sm font-semibold ${sourceOp.id === op.id ? 'border-slate-900 bg-slate-900 text-white shadow-md' : 'border-slate-200 text-slate-600 hover:border-slate-400'}`}>
                                        <OperatorLogo operatorId={op.id.split('_')[0]} size={20} logo={op.logo} />
                                        {op.name}
                                    </button>
                                ))}
                            </div>

                            {/* Number for that operator — switching operator above always clears this,
                                so you never end up debiting the wrong network's leftover number. */}
                            <div>
                                <p className="text-xs text-slate-400 font-medium mb-2">Numéro à débiter ({sourceOp.name})</p>
                                {isOwnOperator ? (
                                    <>
                                        <div className="flex gap-2">
                                            <button onClick={() => setUseOtherSrc(false)}
                                                className={`flex items-center gap-2 px-3 py-2.5 rounded-xl border-2 text-sm font-semibold transition-all flex-1 ${!useOtherSrc ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 text-slate-600 hover:border-slate-300'}`}>
                                                <Icons.User size={14} />
                                                {user.phone}
                                            </button>
                                            <button onClick={() => setUseOtherSrc(u => !u)}
                                                className={`flex items-center gap-2 px-3 py-2.5 rounded-xl border-2 text-sm font-semibold transition-all ${useOtherSrc ? 'border-purple-600 bg-purple-600 text-white' : 'border-slate-200 text-slate-600 hover:border-purple-300'}`}>
                                                <Icons.Plus size={14} />
                                                Autre
                                            </button>
                                        </div>
                                        {useOtherSrc && (
                                            <div className="flex items-center gap-2 mt-2 animate-fade-in">
                                                <span className="text-sm text-slate-400 font-medium px-2">+225</span>
                                                <input type="tel" placeholder="00 00 00 00 00" value={otherSrc}
                                                    onChange={e => setOtherSrc(e.target.value.replace(/\D/g,'').substring(0,10))}
                                                    className="flex-1 px-3 py-2.5 border-2 border-slate-200 rounded-xl text-sm outline-none focus:border-purple-400 transition-colors" />
                                            </div>
                                        )}
                                    </>
                                ) : (
                                    <div className="flex items-center gap-2 animate-fade-in">
                                        <span className="text-sm text-slate-400 font-medium px-2">+225</span>
                                        <input type="tel" placeholder={`Votre numéro ${sourceOp.name}`} value={otherSrc} autoFocus
                                            onChange={e => setOtherSrc(e.target.value.replace(/\D/g,'').substring(0,10))}
                                            className="flex-1 px-3 py-2.5 border-2 border-purple-300 rounded-xl text-sm outline-none focus:border-purple-500 transition-colors" />
                                    </div>
                                )}
                            </div>

                            {effSrc.length >= 8 && (
                                <p className="text-xs text-slate-500 px-1">
                                    <span className="font-semibold text-emerald-600">{effSrc} — sera débité</span>
                                </p>
                            )}
                        </div>

                        {/* ── VERS ── */}
                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-4">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Vers</p>

                            {/* Receiver phone — operator badge below is auto-detected from this */}
                            <div>
                                <p className="text-xs text-slate-400 font-medium mb-2">Numéro du bénéficiaire</p>
                                <div className="flex items-center border-2 border-slate-200 rounded-xl overflow-hidden focus-within:border-purple-400 transition-colors">
                                    <span className="pl-3 text-sm text-slate-400 font-medium flex-shrink-0">+225</span>
                                    <input type="tel" placeholder="00 00 00 00 00" value={receiverPhone}
                                        onChange={e => { setReceiverPhone(e.target.value.replace(/\D/g,'').substring(0,10)); setReceiverName(''); }}
                                        className="flex-1 px-3 py-3 text-sm outline-none text-slate-900 font-medium" />
                                </div>
                            </div>

                            {/* Auto-detected receiver operator */}
                            {destOp && (
                                <div className="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-purple-50 border border-purple-200 animate-fade-in">
                                    <OperatorLogo operatorId={destOp.code.split('_')[0].toLowerCase()} size={22} logo={operators.find(o => o.code === destOp.code)?.logo} />
                                    <p className="text-sm font-semibold text-purple-700 flex items-center gap-1.5">
                                        <Icons.CheckCircle size={13} /> {destOp.name} détecté
                                    </p>
                                </div>
                            )}
                            {receiverPhone.length >= 2 && !destOp && (
                                <p className="text-xs text-amber-600 font-medium">Opérateur non reconnu pour ce numéro.</p>
                            )}

                            {/* Quick contacts */}
                            {contacts.length > 0 && (
                                <div>
                                    {frequentContacts.length > 0 && (
                                        <p className="text-xs text-slate-400 font-medium mb-2 flex items-center gap-1">
                                            <Icons.User size={12} /> Fréquents, d'après votre historique
                                        </p>
                                    )}
                                    <input type="text" placeholder="🔍  Rechercher un contact..." value={search}
                                        onChange={e => setSearch(e.target.value)}
                                        className="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs outline-none focus:border-slate-400 transition-colors mb-2" />
                                    <div className="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
                                        {filteredContacts.slice(0,8).map(c => (
                                            <button key={c.phone} onClick={() => { setReceiverPhone(c.phone); setReceiverName(c.name); }}
                                                className={`flex-shrink-0 flex flex-col items-center gap-1 px-3 py-2 rounded-2xl border-2 transition-all text-center relative ${receiverPhone === c.phone ? 'border-purple-600 bg-purple-50' : 'border-slate-200 hover:border-slate-300'}`}>
                                                <div className="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-600 font-bold text-xs">
                                                    {c.name.split(' ').map(n=>n[0]).join('').substring(0,2)}
                                                </div>
                                                <span className="text-xs font-medium text-slate-700 max-w-16 truncate">{c.name.split(' ')[0]}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* ── MONTANT ── */}
                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-3">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Montant</p>
                            <div className="flex items-stretch border-2 border-slate-200 rounded-2xl overflow-hidden focus-within:border-slate-900 transition-colors">
                                <input type="tel" value={amount} placeholder="0"
                                    onChange={e => { if (/^\d*$/.test(e.target.value)) setAmount(e.target.value); }}
                                    className="flex-1 px-4 py-4 text-3xl font-bold outline-none text-slate-900 bg-white min-w-0" />
                                <div className="bg-slate-100 px-4 flex items-center border-l-2 border-slate-200">
                                    <span className="text-slate-700 font-bold text-sm">XOF</span>
                                </div>
                            </div>

                            {/* Quick amounts */}
                            <div className="flex gap-2">
                                {[1000, 5000, 10000, 25000].map(a => (
                                    <button key={a} onClick={() => setAmount(String(a))}
                                        className={`flex-1 py-2 rounded-xl text-xs font-bold border-2 transition-all ${amount === String(a) ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 text-slate-600 hover:border-slate-400'}`}>
                                        {a.toLocaleString()}
                                    </button>
                                ))}
                            </div>

                            {/* Preview — always the real numbers. There is no "someone else pays the
                                fee" mode server-side, so this never shows a total lower than what
                                actually gets debited. */}
                            {numAmount > 0 && (
                                <div className="bg-slate-50 rounded-2xl p-3 space-y-1.5 text-sm">
                                    <div className="flex justify-between text-slate-500"><span>Votre correspondant reçoit</span><span className="font-bold text-slate-800">{numAmount.toLocaleString()} XOF</span></div>
                                    <div className="flex justify-between text-slate-500">
                                        <span>Frais {interFee > 0 ? '(1% + 0.5% inter-opérateur)' : '(1%)'}</span>
                                        <span className="font-semibold text-slate-700">{totalFee.toLocaleString()} XOF</span>
                                    </div>
                                    <div className="flex justify-between border-t border-slate-200 pt-1.5"><span className="font-bold text-slate-900">Total débité</span><span className="font-bold text-slate-900">{totalDebit.toLocaleString()} XOF</span></div>
                                </div>
                            )}
                        </div>

                        {/* ── CODE SECRET ── */}
                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Code secret</p>
                            <PinInput value={pin} onChange={setPin} label="" placeholder="••••" />
                        </div>

                        {/* ── ERROR ── */}
                        {error && <InlineMessage type="error" message={error} />}

                        {/* ── SEND BUTTON ── */}
                        <button onClick={() => isValid && setShowConfirm(true)} disabled={!isValid || isLoading}
                            className={`w-full py-5 rounded-3xl font-bold text-lg transition-all ${isValid && !isLoading ? 'bg-slate-900 text-white hover:bg-slate-800 shadow-xl shadow-slate-900/20' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                            {isLoading ? (
                                <span className="flex items-center justify-center gap-2">
                                    <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                                    Envoi en cours...
                                </span>
                            ) : `Envoyer ${numAmount > 0 ? numAmount.toLocaleString() + ' XOF' : ''}`}
                        </button>
                    </div>

                    {/* Confirmation modal */}
                    {showConfirm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm px-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4 animate-scale-in">
                                <h3 className="text-lg font-bold text-slate-900 text-center">Confirmer l'envoi</h3>
                                <div className="bg-slate-50 rounded-2xl p-4 space-y-2 text-sm">
                                    <div className="flex justify-between"><span className="text-slate-500">De (sera débité)</span><span className="font-semibold">{effSrc} · {sourceOp?.name}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-500">Vers</span><span className="font-semibold">{receiverPhone} · {destOp?.name}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-500">Montant</span><span className="font-bold">{numAmount.toLocaleString()} XOF</span></div>
                                    <div className="flex justify-between"><span className="text-slate-500">Frais</span><span className="font-semibold">{totalFee.toLocaleString()} XOF</span></div>
                                    <div className="flex justify-between border-t border-slate-200 pt-2"><span className="font-bold">Total débité</span><span className="font-bold text-slate-900">{totalDebit.toLocaleString()} XOF</span></div>
                                </div>
                                <p className="text-red-500 text-xs text-center font-medium">* Aucun remboursement ne sera possible</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowConfirm(false)} className="flex-1 py-3 border-2 border-slate-200 text-slate-600 rounded-2xl font-semibold text-sm hover:bg-slate-50">Annuler</button>
                                    <button onClick={() => { setShowConfirm(false); handleSend(); }} className="flex-1 py-3 bg-slate-900 text-white rounded-2xl font-semibold text-sm hover:bg-slate-800">Confirmer</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };




        const DashboardView = ({ setView, transactions, user, onTxnClick, setUser }) => {
            const hour = new Date().getHours();
            const greeting = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";

            const AVATAR_KEY = `interpay_avatar_${user?.phone || 'user'}`;
            const [showPhotoMenu, setShowPhotoMenu] = React.useState(false);

            React.useEffect(() => {
                const saved = localStorage.getItem(AVATAR_KEY);
                if (saved && !user.avatar) setUser(prev => ({...prev, avatar: saved}));
            }, []);

            const handleAvatarUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const dataUrl = reader.result;
                        setUser(prev => ({...prev, avatar: dataUrl}));
                        localStorage.setItem(AVATAR_KEY, dataUrl);
                        setShowPhotoMenu(false);
                    };
                    reader.readAsDataURL(file);
                }
                e.target.value = '';
            };

            const handleDeleteAvatar = () => {
                setUser(prev => ({...prev, avatar: null}));
                localStorage.removeItem(AVATAR_KEY);
                setShowPhotoMenu(false);
            };

            // Quick action items configuration
            const quickActions = [
                { id: 'send',          icon: Icons.Send,    label: 'Send',          color: 'blue',   view: 'send' },
                { id: 'international', icon: Icons.Globe,   label: 'International', color: 'purple', view: 'international' },
                { id: 'giftcard',      icon: Icons.Gift,    label: 'Cards',         color: 'pink',   view: 'giftcard' },
                { id: 'history',       icon: Icons.History, label: 'History',       color: 'amber',  view: 'history' },
            ];

            const colorMap = {
                emerald: { bg: 'bg-emerald-50', text: 'text-emerald-600', hover: 'group-hover:bg-emerald-600', shadow: 'shadow-emerald-500/20' },
                blue: { bg: 'bg-blue-50', text: 'text-blue-600', hover: 'group-hover:bg-blue-600', shadow: 'shadow-blue-500/20' },
                orange: { bg: 'bg-orange-50', text: 'text-orange-600', hover: 'group-hover:bg-orange-500', shadow: 'shadow-orange-500/20' },
                purple: { bg: 'bg-purple-50', text: 'text-purple-600', hover: 'group-hover:bg-purple-600', shadow: 'shadow-purple-500/20' },
                amber: { bg: 'bg-amber-50', text: 'text-amber-600', hover: 'group-hover:bg-amber-500', shadow: 'shadow-amber-500/20' },
                pink:  { bg: 'bg-pink-50',  text: 'text-pink-600',  hover: 'group-hover:bg-pink-500',  shadow: 'shadow-pink-500/20' },
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    {/* ===== 1. GREETING HEADER (Premium) ===== */}
                    <div className="flex justify-between items-start px-1 slide-up" style={{ animationDelay: '0.1s', opacity: 0 }}>
                        <div>
                            <p className="text-slate-400 text-sm font-medium tracking-wide">{greeting},</p>
                            <h1 className="text-2xl font-extrabold gradient-text mt-0.5 count-up">{user.name.split(' ')[0]} 👋</h1>
                            <div className="flex items-center gap-2 mt-2">
                                <OperatorBadge operator={user.operator} size="sm" />
                                <span className="text-xs text-slate-400 font-medium">{user.phone}</span>
                            </div>
                        </div>
                        
                        {/* Avatar with photo menu */}
                        <div className="relative">
                            <button onClick={() => setShowPhotoMenu(m => !m)} className="relative block">
                                <div className="relative">
                                    {user.avatar ? (
                                        <img src={user.avatar} className="w-14 h-14 rounded-2xl object-cover border-2 border-white shadow-lg" alt="Avatar" />
                                    ) : (
                                        <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-slate-100 to-slate-200 border-2 border-white shadow-lg flex items-center justify-center text-slate-700">
                                            <span className="font-bold text-lg">{user.name.split(' ').map(n=>n[0]).join('')}</span>
                                        </div>
                                    )}
                                    <div className="absolute -bottom-0.5 -right-0.5 w-4 h-4 bg-emerald-500 rounded-full border-2 border-white"></div>
                                    <div className="absolute -bottom-1 -left-1 bg-slate-900 text-white rounded-lg p-1 border-2 border-white shadow-md">
                                        <Icons.Camera size={9} />
                                    </div>
                                </div>
                            </button>
                            {/* Photo menu — centered modal */}
                            {showPhotoMenu && (
                                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm px-6" onClick={() => setShowPhotoMenu(false)}>
                                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-xs overflow-hidden animate-scale-in" onClick={e => e.stopPropagation()}>
                                        <p className="text-center text-xs text-slate-400 uppercase tracking-widest font-semibold pt-5 pb-3">Photo de profil</p>
                                        <div className="h-px bg-slate-100" />
                                        <label htmlFor="avatar-upload" className="flex items-center gap-3 px-5 py-4 hover:bg-slate-50 cursor-pointer transition-colors">
                                            <Icons.Camera size={18} className="text-purple-600 flex-shrink-0" />
                                            <span className="font-semibold text-slate-800 text-sm">{user.avatar ? 'Changer la photo' : 'Ajouter une photo'}</span>
                                        </label>
                                        <div className="h-px bg-slate-100" />
                                        <button onClick={user.avatar ? handleDeleteAvatar : undefined} disabled={!user.avatar}
                                            className={`w-full flex items-center gap-3 px-5 py-4 transition-colors ${user.avatar ? 'hover:bg-red-50 cursor-pointer' : 'opacity-40 cursor-not-allowed'}`}>
                                            <Icons.X size={18} className={`flex-shrink-0 ${user.avatar ? 'text-red-500' : 'text-slate-400'}`} />
                                            <span className={`font-semibold text-sm ${user.avatar ? 'text-red-500' : 'text-slate-400'}`}>Supprimer la photo</span>
                                        </button>
                                        <div className="h-px bg-slate-100" />
                                        <button onClick={() => setShowPhotoMenu(false)} className="w-full py-4 text-slate-400 font-medium text-sm hover:bg-slate-50 transition-colors">Annuler</button>
                                    </div>
                                </div>
                            )}
                            <input id="avatar-upload" type="file" accept="image/*" className="hidden" onChange={handleAvatarUpload} />
                        </div>
                    </div>


                    {/* ===== INTERPAY HERO BANNER — adapts to user country ===== */}
                    {(() => {
                        const country = user.operator?.endsWith('_SN') ? 'SN'
                                      : user.operator?.endsWith('_BF') ? 'BF' : 'CI';
                        const heroConfig = {
                            CI: { flag: '🇨🇮', label: "Côte d'Ivoire", ops: 'Wave · Orange · MTN · Moov' },
                            SN: { flag: '🇸🇳', label: 'Sénégal',        ops: 'Wave SN · Orange SN' },
                            BF: { flag: '🇧🇫', label: 'Burkina Faso',   ops: 'Orange BF · Moov BF' },
                        };
                        const cfg = heroConfig[country];
                        return (
                            <div className="slide-up bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 rounded-2xl p-5 text-white shadow-xl shadow-slate-900/30 shine-effect" style={{ animationDelay: '0.2s', opacity: 0 }}>
                                <div className="flex justify-between items-center">
                                    <div>
                                        <p className="text-slate-400 text-xs font-semibold uppercase tracking-widest mb-1">InterPay</p>
                                        <p className="text-white font-bold text-lg leading-tight">Send to any network,</p>
                                        <p className="text-emerald-400 font-bold text-lg leading-tight">instantly {cfg.flag}</p>
                                        <p className="text-slate-400 text-xs mt-2">{cfg.ops}</p>
                                    </div>
                                    <div className="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center">
                                        <Icons.Send size={24} className="text-emerald-400" />
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* ===== 3. QUICK ACTIONS GRID (Premium) ===== */}
                    <div className="slide-up" style={{ animationDelay: '0.3s', opacity: 0 }}>
                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 px-1 flex items-center gap-2">
                            <span className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                            Quick Actions
                        </h3>

                const matchSearch = !search || receiver.includes(search.toLowerCase()) || operator.includes(search.toLowerCase());
                const matchFilter = filter === 'All' || t.status === filter;

            // ── Group the filtered list by date, most recent first ──

                const todayStr = new Date().toISOString().split('T')[0];

                const label = key => key === todayStr ? "Aujourd'hui" : key === yestStr ? 'Hier' : key;
                const groups = {};
                filtered.forEach(t => {
                    const key = t.date || 'Autre';
                    (groups[key] = groups[key] || []).push(t);

                return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(key => ({ label: label(key), items: groups[key] }));
            }, [filtered]);

                    return t.status === 'Success' && d && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                });

            const [confirmPin,  setConfirmPin]  = useState('');
            const [isChanging,  setIsChanging]  = useState(false);
            const [pinError,    setPinError]    = useState('');
            const [pinSuccess,  setPinSuccess]  = useState('');
            const toast = useToast();

            const handleChangePin = async () => {
                setPinError(''); setPinSuccess('');
                if (newPin !== confirmPin) { setPinError('Les deux nouveaux codes ne correspondent pas.'); return; }
                setIsChanging(true);
                try {
                    const result = await AuthService.changePin(oldPin, newPin);
                    if (result.success) {
                        setPinSuccess('Code secret mis à jour avec succès.');
                        setOldPin(''); setNewPin(''); setConfirmPin('');
                        toast.success('Code secret changé.');
                    } else {
                        setPinError(result.error);
                    }
                } catch {
                    setPinError('Erreur inattendue.');
                } finally {
                    setIsChanging(false);
                }
            };

            const lastLoginFormatted = user.last_login
                ? new Date(user.last_login).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' })
                : '—';

            const pinFormValid = oldPin.length === 4 && newPin.length === 4 && confirmPin.length === 4;

            return (
                <div className="max-w-xl mx-auto pb-8 animate-fade-in space-y-5">
                    <div className="flex items-center gap-3 mb-2">
                        <button onClick={() => setView('dashboard')} className="p-2 hover:bg-slate-100 rounded-full transition-colors">

                                <p className="font-bold text-slate-900 truncate">{user.name}</p>

                        <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Apparence</p>
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2 text-slate-700 font-semibold text-sm">
                                {darkMode ? <Icons.Moon size={16} /> : <Icons.Sun size={16} />}
                                {darkMode ? 'Mode sombre' : 'Mode clair'}
                            </div>
                            <button onClick={() => setDarkMode(d => !d)}
                                className={`relative w-12 h-6 rounded-full transition-colors duration-150 ${darkMode ? 'bg-slate-900' : 'bg-slate-300'}`}>
                                <span className={`absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform duration-150 ${darkMode ? 'translate-x-6' : 'translate-x-0'}`} />
                            </button>
                        </div>
                    </div>

                    {/* ── CHANGER LE CODE SECRET ── */}
                    <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-3">
                        <p className="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                            <Icons.Lock size={12} /> Changer le code secret
                        </p>
                        <div>
                            <p className="text-xs text-slate-400 font-medium mb-1.5">Code actuel</p>
                            <PinInput value={oldPin} onChange={setOldPin} label="" placeholder="••••" />
                        </div>
                        <div>
                            <p className="text-xs text-slate-400 font-medium mb-1.5">Nouveau code</p>
                            <PinInput value={newPin} onChange={setNewPin} label="" placeholder="••••" />
                        </div>
                        <div>
                            <p className="text-xs text-slate-400 font-medium mb-1.5">Confirmer le nouveau code</p>
                            <PinInput value={confirmPin} onChange={setConfirmPin} label="" placeholder="••••" />
                        </div>
                        {pinError && <InlineMessage type="error" message={pinError} />}
                        {pinSuccess && <InlineMessage type="success" message={pinSuccess} />}
                        <button
                            onClick={handleChangePin}
                            disabled={isChanging || !pinFormValid}
                            className={`w-full py-3.5 rounded-2xl font-bold text-sm transition-all ${!isChanging && pinFormValid ? 'bg-slate-900 text-white hover:bg-slate-800' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                            {isChanging ? 'Mise à jour...' : 'Mettre à jour le code secret'}
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentView, setCurrentView] = useState('dashboard');
            const [transactions, setTransactions] = useState([]);
            const [lastTxn, setLastTxn] = useState(null);
            const [user, setUser] = useState(null);
            const [historyInitTxn, setHistoryInitTxn] = useState(null);
            const [isLoadingData, setIsLoadingData] = useState(false);
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('interpay_dark') === '1');

            // Persist the theme choice and flip a body class the global
            // dark-mode stylesheet (see <style id="dark-mode-overrides">) reacts to.
            useEffect(() => {
                document.body.classList.toggle('interpay-dark', darkMode);
                localStorage.setItem('interpay_dark', darkMode ? '1' : '0');
            }, [darkMode]);

            // Refresh transactions + balance whenever we land on Dashboard or History —
            // not just once at login. Without this, money that arrives from someone
            // else's action (they send you money, an international credit lands, etc.)
            // never shows up in an already-open session: nothing was polling or pushing
            // updates, so the only way to see it was to log out and back in.
            useEffect(() => {
                if (isLoggedIn && user && (currentView === 'dashboard' || currentView === 'history')) {
                    loadTransactions();
                    refreshBalance();
                }
            }, [isLoggedIn, currentView]);

            // Load transactions from TransactionService
            const loadTransactions = async () => {
                setIsLoadingData(true);
                try {
                    const result = await TransactionService.getHistory({}, true);
                    if (result.success) {
                        setTransactions(result.data.transactions);
                    }
                } catch (err) {
                    console.error('Failed to load transactions:', err);
                } finally {
                    setIsLoadingData(false);
                }
            };

            // Refresh balance from service
            const refreshBalance = async () => {
                try {
                    const result = await TransactionService.getBalance();
                    if (result.success) {
                        // The Gateway returns the balance as a bare number; older Gateways returned { balance }.
                        const b = typeof result.data === 'number' ? result.data : result.data?.balance;
                        if (typeof b === 'number') setUser(prev => ({ ...prev, balance: b }));
                    }
                } catch (err) {
                    console.error('Failed to refresh balance:', err);
                }
            };

            // After any transaction, just reload the transaction history
            const updateUserBalance = (newBalance) => {
                loadTransactions();
            };

            // Add transaction (for legacy views like ScanQR and GiftCard)
            const addTransaction = (newTxn) => {
                setTransactions(prev => [newTxn, ...prev]);
            };

            // Handle logout using AuthService
            const handleLogout = async () => {
                await AuthService.logout();
                // Clear all caches
                ContactService.clearCache();
                TransactionService.clearCache();
                // Reset state
                setIsLoggedIn(false);
                setUser(null);
                setTransactions([]);
                setCurrentView('dashboard');
                setLastTxn(null);
                setHistoryInitTxn(null);
            };

            if (!isLoggedIn || !user) return <AuthView onLogin={() => setIsLoggedIn(true)} setUser={setUser} />;

            return (
                <div className="min-h-screen pb-10 max-w-lg mx-auto bg-slate-50 min-h-screen shadow-2xl relative">
                    <div className="bg-white/80 backdrop-blur-md sticky top-0 z-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                         <div onClick={() => setCurrentView('dashboard')} className="font-bold text-xl tracking-tight cursor-pointer flex items-center gap-2">
                            <div className="w-8 h-8 bg-slate-900 rounded-lg text-white flex items-center justify-center"><Icons.Globe size={18}/></div>
                            InterPay
                         </div>
                         <div className="flex items-center gap-3">
                         <button onClick={() => setCurrentView('settings')} className="text-slate-400 hover:text-slate-700 p-1.5 rounded-full hover:bg-slate-100 transition-colors">
                            <Icons.Settings size={18}/>
                         </button>
                         <button onClick={handleLogout} className="text-slate-400 hover:text-red-500 flex items-center gap-1 text-sm">
                            <Icons.LogOut size={18}/>
                            <span className="hidden sm:inline">Logout</span>
                         </button>
                         </div>
                    </div>

                    <main className="p-6">
                        {isLoadingData && currentView === 'dashboard' && (
                            <div className="text-center py-8">
                                <div className="w-8 h-8 border-2 border-slate-200 border-t-slate-900 rounded-full animate-spin mx-auto mb-2"></div>
                                <p className="text-sm text-slate-500">Loading your data...</p>
                            </div>
                        )}
                        {currentView === 'dashboard' && !isLoadingData && (
                            <DashboardView 
                                setView={setCurrentView} 
                                transactions={transactions} 
                                user={user} 
                                setUser={setUser}
                                onTxnClick={(txn) => { setHistoryInitTxn(txn); setCurrentView('history'); }} 
                            />
                        )}
                        {currentView === 'send' && (
                            <SendMoneyView
                                setView={setCurrentView}
                                setLastTxn={setLastTxn}
                                updateUserBalance={updateUserBalance}
                                user={user}
                                transactions={transactions}
                            />
                        )}
                        {currentView === 'scan' && <ScanQRView setView={setCurrentView} setLastTxn={setLastTxn} updateUserBalance={updateUserBalance} user={user} />}
                        {currentView === 'giftcard' && <GiftCardView setView={setCurrentView} setLastTxn={setLastTxn} updateUserBalance={updateUserBalance} user={user} />}
                        {currentView === 'international' && <InternationalView setView={setCurrentView} setLastTxn={setLastTxn} updateUserBalance={updateUserBalance} user={user} transactions={transactions} />}
                        {currentView === 'status' && <StatusView txn={lastTxn} setView={setCurrentView} />}
                        {currentView === 'history' && (
                            <HistoryView 
                                transactions={transactions} 
                                setView={setCurrentView} 
                                initialTxn={historyInitTxn} 
                                clearInitialTxn={() => setHistoryInitTxn(null)}
                            />
                        )}
                        {currentView === 'settings' && (
                            <SettingsView setView={setCurrentView} user={user} darkMode={darkMode} setDarkMode={setDarkMode} />
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ToastProvider><App /></ToastProvider>);
    </script>
</body>
</html>
